<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="励小加">
    <meta name="copyright" content="© 2026 励小加. 保留所有权利。">
    <title>读出来</title>
    <style>
        :root { --font-size: 21px; --font-weight: 400; --letter-spacing: 1.5px; --line-height: 1.8; --text-color: #1e1e1e; --bg-color: #fdfbf7; --card-bg: #ffffff; --border-color: #d5cfc6; --accent: #4a7c6b; --accent-light: #e8f4ef; --accent-warm: #f0c040; --danger: #b84040; --danger-light: #fef0f0; --shadow: 0 2px 10px rgba(0,0,0,0.06); --shadow-lg: 0 4px 22px rgba(0,0,0,0.10); --radius: 10px; --settings-font-size: 15px; --highlight-bg: #fff3cd; }
        .theme-classic { --bg-color: #fdfbf7; --card-bg: #ffffff; --text-color: #1e1e1e; --border-color: #d5cfc6; --accent: #4a7c6b; --accent-light: #e8f4ef; --highlight-bg: #fff3cd; }
        .theme-warm { --bg-color: #fdf5e6; --card-bg: #fffaf0; --text-color: #4a3a2a; --border-color: #d5c4a1; --accent: #8b6b4a; --accent-light: #f0e4d0; --highlight-bg: #f0e0c0; }
        .theme-dark { --bg-color: #2a2a2a; --card-bg: #333333; --text-color: #e0e0e0; --border-color: #555555; --accent: #7ba4a0; --accent-light: #3a4a4a; --highlight-bg: #5a5a30; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; background: var(--bg-color); color: var(--text-color); font-size: 17px; min-height: 100vh; display: flex; justify-content: center; letter-spacing: 0.4px; transition: background 0.3s, color 0.3s; }
        .app-container { display: flex; width: 100%; max-width: 1450px; min-height: 100vh; }
        .main-area { flex: 1; display: flex; flex-direction: column; padding: 18px 22px 60px; min-width: 0; transition: margin-right 0.3s ease; }
        .main-area.expanded { margin-right: 0; }
        .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 14px; position: sticky; top: 12px; z-index: 50; border: 1px solid var(--border-color); }
        .toolbar-spacer { flex: 1; min-width: 8px; }
        .toolbar-divider { width: 1px; height: 28px; background: var(--border-color); margin: 0 6px; flex-shrink: 0; align-self: center; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 24px; cursor: pointer; font-size: 15px; font-weight: 600; letter-spacing: 0.5px; transition: 0.2s; white-space: nowrap; border: 2px solid transparent; background: var(--card-bg); color: var(--text-color); font-family: inherit; }
        .btn:active { transform: scale(0.95); }
        .btn-play { background: var(--accent); color: #fff; font-size: 16px; padding: 12px 24px; box-shadow: 0 3px 12px rgba(0,0,0,0.2); border-color: transparent; }
        .btn-play.playing { background: #e07b20; animation: pulse 1.5s infinite; }
        .btn-play.paused { background: #5e8a7a; }
        @keyframes pulse { 50% { box-shadow: 0 6px 24px rgba(224,123,32,0.55); } }
        .btn-stop { border-color: var(--border-color); }
        .btn-tool { border-color: var(--border-color); font-size: 14px; padding: 8px 14px; }
        .btn-tool.danger { color: var(--danger); border-color: #ecc; }
        .btn-extra { display: none; }
        .btn-toggle-settings { border-color: var(--border-color); font-size: 14px; padding: 8px 14px; white-space: nowrap; }
        .status-badge { font-size: 14px; color: var(--text-color); padding: 7px 14px; background: var(--card-bg); border-radius: 20px; font-weight: 500; opacity: 0.8; flex-basis: 100%; order: 1; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .status-badge.active { background: #fff8dd; color: #7a6200; font-weight: 700; }
        .message-list { flex: 1; display: flex; flex-direction: column; gap: 16px; position: relative; }
        .msg-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); border: 2px solid transparent; transition: 0.2s; overflow: hidden; position: relative; z-index: 1; }
        .msg-card.reading { border-color: var(--accent-warm) !important; box-shadow: 0 0 0 7px rgba(240,192,64,0.18), var(--shadow-lg); }
        .msg-card.drag-over-card { border-color: var(--accent) !important; background: var(--accent-light) !important; }
        .msg-card.collapsed .msg-body { display: none; }
        .msg-card.collapsed .msg-preview { display: block; }
        .msg-preview { display: none; padding: 10px 16px; color: var(--text-color); opacity: 0.6; font-style: italic; }
        .msg-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .msg-number { background: var(--accent-light); color: var(--accent); border-radius: 18px; padding: 0 14px; font-weight: 700; transition: 0.2s; border: 2px solid transparent; line-height: 32px; cursor: grab; user-select: none; }
        .msg-number:active { cursor: grabbing; }
        .msg-card.reading .msg-number { background: var(--accent-warm); color: #5c3d00; }
        .sentence-indicator { padding: 4px 16px 8px; font-size: 15px; color: #b45f06; background: #fff8e7; border-bottom: 1px solid #ffe0a3; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
        .msg-card.reading .sentence-indicator { display: block; }
        .msg-btn { padding: 6px 12px; border-radius: 16px; border: 2px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; color: var(--text-color); }
        .msg-btn.delete-msg-btn { color: var(--danger); border-color: #f0d0d0; margin-left: auto; }
        .msg-btn.play-msg-btn.playing { background: #e07b20; color: #fff; border-color: #e07b20; }
        .msg-btn.play-msg-btn.paused { background: #5e8a7a; color: #fff; border-color: #5e8a7a; }
        .msg-body { padding: 12px 16px; max-height: 66vh; overflow-y: auto; position: relative; display: grid; }
        .msg-body textarea { grid-area: 1/1; background: transparent; border: none; font-size: var(--font-size); font-weight: var(--font-weight); font-family: inherit; color: var(--text-color); letter-spacing: var(--letter-spacing); line-height: var(--line-height); resize: none; outline: none; min-height: 50px; field-sizing: content; z-index: 1; white-space: pre-wrap; word-wrap: break-word; padding: 0; }
        .first-empty .msg-body textarea { min-height: 120px; }
        .msg-body textarea[readonly] { cursor: not-allowed; opacity: 0.8; }
        .highlight-overlay { grid-area: 1/1; pointer-events: none; white-space: pre-wrap; word-wrap: break-word; font-size: var(--font-size); font-weight: var(--font-weight); font-family: inherit; letter-spacing: var(--letter-spacing); line-height: var(--line-height); color: transparent; z-index: 0; padding: 0; }
        .highlight-overlay mark { background: var(--highlight-bg); color: transparent; border-radius: 4px; }
        .btn-add-new { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 14px 20px; background: var(--card-bg); border: 3px dashed var(--border-color); border-radius: var(--radius); cursor: pointer; font-size: 15px; font-weight: 600; color: var(--text-color); margin-top: 12px; transition: 0.2s; opacity: 0.8; text-align: center; }
        .btn-add-new:hover { border-color: var(--accent); opacity: 1; }
        .bg-hint { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(32px, 8vw, 88px); font-weight: 800; color: var(--text-color); opacity: 0.07; pointer-events: none; z-index: 0; text-align: center; white-space: pre-line; padding: 40px; line-height: 1.3; }
        .settings-panel { width: 320px; flex-shrink: 0; background: var(--card-bg); border-left: 1px solid var(--border-color); padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overflow-x: hidden; position: sticky; top: 0; z-index: 40; height: 100vh; transition: all 0.3s ease; font-size: var(--settings-font-size); }
        .settings-panel.collapsed { width: 0; min-width: 0; padding: 0; overflow: hidden; border-left: none; }
        .settings-content { display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
        .setting-group { display: flex; flex-direction: column; gap: 4px; }
        .setting-group label { font-size: var(--settings-font-size); font-weight: 700; color: var(--text-color); opacity: 0.8; }
        .setting-group select { padding: 9px 10px; border-radius: 8px; border: 2px solid var(--border-color); font-size: var(--settings-font-size); background: var(--card-bg); color: var(--text-color); width: 100%; }
        .voice-group { flex: 1; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
        .voice-group select { flex: 1; min-height: 0; font-size: var(--settings-font-size); overflow-x: auto; white-space: nowrap; }
        .voice-search { padding: 7px 10px; border-radius: 8px; border: 2px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: var(--settings-font-size); }
        .theme-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
        .theme-btn { padding: 8px 12px; border-radius: 20px; border: 2px solid var(--border-color); background: var(--card-bg); cursor: pointer; font-size: var(--settings-font-size); font-weight: 600; transition: 0.2s; color: var(--text-color); }
        .theme-btn.active { border-color: var(--accent); background: var(--accent-light); }
        .btn-reset-settings { display: block; margin: 0 auto; padding: 6px 12px; font-size: 13px; border-radius: 20px; border: 2px solid var(--border-color); background: var(--card-bg); cursor: pointer; color: var(--text-color); font-weight: 600; white-space: nowrap; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .toggle-row .toggle-label { font-size: var(--settings-font-size); font-weight: 700; color: var(--text-color); opacity: 0.8; flex: 1; }
        .toggle-switch { position: relative; width: 48px; height: 26px; flex-shrink: 0; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
        .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #ccc; border-radius: 26px; transition: 0.3s; }
        .toggle-slider::before { content: ""; position: absolute; height: 20px; width: 20px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked+.toggle-slider { background: var(--accent); }
        .toggle-switch input:checked+.toggle-slider::before { transform: translateX(22px); }
        .setting-label-row { display: flex; align-items: baseline; gap: 4px; }
        .setting-label-row label { font-size: var(--settings-font-size); font-weight: 700; color: var(--text-color); opacity: 0.8; }
        .setting-label-row span { font-size: 18px; }
        .setting-row { display: flex; gap: 16px; }
        .setting-row .setting-group { flex: 1; min-width: 0; overflow: hidden; }
        .loop-row { display: flex; align-items: center; gap: 8px; }
        .loop-row input[type="number"] { width: 60px; padding: 6px 8px; border-radius: 8px; border: 2px solid var(--border-color); font-size: var(--settings-font-size); background: var(--card-bg); color: var(--text-color); text-align: center; }
        .sort-ghost { position: fixed; pointer-events: none; z-index: 1000; background: var(--accent-light); border: 2px dashed var(--accent); border-radius: 8px; padding: 4px 16px; font-weight: 700; color: var(--accent); opacity: 0.9; transform: translate(-50%, -50%); }
        .sort-indicator { height: 4px; background: #4a7c6b; margin: 0 0; border-radius: 2px; pointer-events: none; position: relative; z-index: 5; }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 300; display: flex; align-items: center; justify-content: center; }
        .modal-box { background: var(--card-bg); border-radius: var(--radius); padding: 24px; max-width: 360px; width: 90%; box-shadow: var(--shadow-lg); text-align: center; }
        .modal-box p { margin-bottom: 20px; font-size: 16px; font-weight: 500; color: var(--text-color); white-space: pre-line; }
        .modal-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .modal-buttons .btn { min-width: 80px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #3a3a3a; color: #fff; padding: 13px 26px; border-radius: 28px; font-weight: 600; opacity: 0; transition: 0.3s; z-index: 200; }
        .toast.show { opacity: 1; }
        @media (max-width: 900px) { .app-container { flex-direction: column; } .settings-panel { width: 100%; height: auto; position: relative; } .settings-panel.collapsed { width: 100%; height: 0; padding: 0; } .main-area.expanded { margin-right: 0; } .toolbar-divider { display: none; } .toolbar-spacer { display: none; } }
    </style>
</head>
<body class="theme-classic">
    <div class="app-container">
        <main class="main-area expanded" id="mainArea">
            <div class="toolbar">
                <button class="btn btn-play" id="btnPlay">▶ 开始朗读</button>
                <button class="btn btn-stop" id="btnStop">不读了</button>
                <span class="status-badge" id="statusBadge">
                    <button id="btnPrev" title="返回上一句 (1.5秒后朗读)" style="border:none;background:transparent;font-size:14px;padding:0 4px;cursor:pointer;color:inherit;font-family:inherit;">⏮ 上一句</button>
                    <button id="btnNext" title="跳到下一句 (1.5秒后朗读)" style="border:none;background:transparent;font-size:14px;padding:0 4px;cursor:pointer;color:inherit;font-family:inherit;">下一句 ⏭</button>
                    <span id="statusText">就绪 · 共 <strong id="msgCount">1</strong> 条</span>
                </span>
                <button class="btn btn-tool" id="btnAddTop" style="color: #1a73e8;">加一条</button>
                <span class="toolbar-spacer"></span>
                <span class="toolbar-divider"></span>
                <button class="btn btn-tool danger btn-extra" id="btnClearAll">清空内容</button>
                <button class="btn btn-tool btn-extra" id="btnCollapseAll">全折叠</button>
                <button class="btn btn-tool btn-extra" id="btnExpandAll">全展开</button>
                <button class="btn btn-toggle-settings" id="btnToggleSettings" style="color: #1a73e8;">设置</button>
            </div>
            <div class="message-list" id="messageList">
                <div class="bg-hint">把文字拖入空白处<br>即可新加一条</div>
            </div>
            <button class="btn-add-new" id="btnAddNew">📂 支持拖入一个或多个 .txt .md 文件</button>
        </main>
        <aside class="settings-panel collapsed" id="settingsPanel">
            <div class="settings-content">
                <div class="setting-group"><label>配色方案</label>
                    <div class="theme-row" id="themeRow">
                        <button class="theme-btn active" data-theme="classic">经典白</button>
                        <button class="theme-btn" data-theme="warm">暖黄</button>
                        <button class="theme-btn" data-theme="dark">深邃灰</button>
                    </div>
                </div>
                <div class="setting-row">
                    <div class="setting-group"><div class="setting-label-row"><label>字体大小：</label><span id="fontSizeVal">21px</span></div><input type="range" id="fontSize" min="14" max="52" value="21"></div>
                    <div class="setting-group"><div class="setting-label-row"><label>粗细：</label><span id="fontWeightVal">正常</span></div><input type="range" id="fontWeight" min="1" max="3" value="2" step="1"></div>
                </div>
                <div class="setting-row">
                    <div class="setting-group"><div class="setting-label-row"><label>字间距：</label><span id="letterSpacingVal">1.5px</span></div><input type="range" id="letterSpacing" min="-2" max="14" value="1.5" step="0.5"></div>
                    <div class="setting-group"><div class="setting-label-row"><label>行间距：</label><span id="lineHeightVal">1.8</span></div><input type="range" id="lineHeight" min="1.2" max="3.8" value="1.8" step="0.05"></div>
                </div>
                <button class="btn-reset-settings" id="btnResetFont">恢复字体默认设置</button>
                <hr>
                <div class="setting-group"><div class="setting-label-row"><label>朗读语速：</label><span id="speechRateVal">1.2x</span></div><input type="range" id="speechRate" min="0.4" max="5.0" value="1.2" step="0.05"></div>
                <div class="setting-group"><label>搜索语音</label><input type="text" class="voice-search" id="voiceSearch" placeholder="输入关键词过滤"></div>
                <div class="voice-group setting-group"><label>朗读语音</label><select id="voiceSelect" size="6"></select></div>
                <div class="toggle-row"><span class="toggle-label">播报开始/结束提示</span><label class="toggle-switch"><input type="checkbox" id="announceTips" checked><span class="toggle-slider"></span></label></div>
                <div class="toggle-row"><span class="toggle-label">过滤 Markdown 格式符号</span><label class="toggle-switch"><input type="checkbox" id="filterMarkdown" checked><span class="toggle-slider"></span></label></div>
                <div class="toggle-row"><span class="toggle-label">自动跟随高亮滚动</span><label class="toggle-switch"><input type="checkbox" id="autoScrollToggle"><span class="toggle-slider"></span></label></div>
                <div class="loop-row"><span class="toggle-label">循环播放</span><input type="number" id="loopCountInput" min="0" value="0"><span>次</span><label class="toggle-switch"><input type="checkbox" id="loopLockToggle" checked><span class="toggle-slider"></span></label></div>
                <button class="btn-reset-settings" id="btnResetVoice">恢复语音默认设置</button>
                <p style="font-size:11px;color:var(--text-color);opacity:0.6;text-align:center;">制作人：<a href="https://space.bilibili.com/557858654" target="_blank" style="color:inherit;text-decoration:none;">励小加</a></p>
            </div>
        </aside>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <p id="modalMessage">是否把拖入内容替换原有文本</p>
            <div class="modal-buttons">
                <button class="theme-btn" id="modalReplace">替换</button>
                <button class="btn btn-play" id="modalCreate">新建一条</button>
                <button class="theme-btn" id="modalCancel">取消</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <script>
        (function() {
            const $ = id => document.getElementById(id);
            const btnPlay = $('btnPlay'), btnStop = $('btnStop'), statusBadge = $('statusBadge');
            const msgCountEl = $('msgCount'), messageList = $('messageList'), btnAddNew = $('btnAddNew');
            const toast = $('toast'), mainArea = $('mainArea');
            const fontSizeInput = $('fontSize'), fontSizeVal = $('fontSizeVal');
            const fontWeightInput = $('fontWeight'), fontWeightVal = $('fontWeightVal');
            const letterSpacingInput = $('letterSpacing'), letterSpacingVal = $('letterSpacingVal');
            const lineHeightInput = $('lineHeight'), lineHeightVal = $('lineHeightVal');
            const speechRateInput = $('speechRate'), speechRateVal = $('speechRateVal');
            const voiceSelect = $('voiceSelect'), voiceSearch = $('voiceSearch');
            const btnResetFont = $('btnResetFont'), btnResetVoice = $('btnResetVoice');
            const announceTipsToggle = $('announceTips'), filterMarkdownToggle = $('filterMarkdown');
            const autoScrollToggle = $('autoScrollToggle');
            const loopCountInput = $('loopCountInput'), loopLockToggle = $('loopLockToggle');
            const btnToggleSettings = $('btnToggleSettings'), settingsPanel = $('settingsPanel');
            const modalOverlay = $('modalOverlay'), modalMessage = $('modalMessage');
            const modalReplace = $('modalReplace'), modalCreate = $('modalCreate'), modalCancel = $('modalCancel');
            const btnAddTop = $('btnAddTop'), btnCollapseAll = $('btnCollapseAll'), btnExpandAll = $('btnExpandAll'), btnClearAll = $('btnClearAll');
            const btnPrev = $('btnPrev'), btnNext = $('btnNext');
            const statusText = $('statusText');

            let messages = [], msgId = 0;
            let isReading = false, isPaused = false;
            let readingQueue = [], queuePos = 0;
            let currentMsgIndex = -1, currentSentenceText = '', currentSentenceStart = 0;
            let isSingleMode = false;
            let availableVoices = [], allVoiceOptions = [];
            let retryCount = 0;
            let settingsCollapsed = true;
            let pendingDropData = null;
            let wakeLock = null;
            let loopRemaining = 0;
            let currentUtterance = null;
            let utteranceTimeout = null;
            let skipDebounceTimer = null;
            let isDragging = false;

            const displayDefaults = { fontSize: 21, fontWeight: 400, letterSpacing: 1.5, lineHeight: 1.8 };
            const voiceDefaults = { speechRate: 1.2, voiceURI: '', announceTips: true, filterMarkdown: true, loopCount: 0, loopLocked: false, autoScroll: false };
            const defaultTheme = 'classic';
            let settings = { ...displayDefaults, paragraphSpacing: 16, ...voiceDefaults, theme: defaultTheme };

            const fontWeightOptions = [300, 400, 700];
            const fontWeightLabels = ['细', '正常', '粗'];

            function fontWeightToSlider(val) { const idx = fontWeightOptions.indexOf(val); return idx >= 0 ? idx + 1 : 2; }
            function sliderToFontWeight(sliderVal) { return fontWeightOptions[sliderVal - 1] || 400; }

            let sortState = { active: false, sourceIndex: -1, sourceId: null, ghost: null, indicator: null, targetIndex: -1, pos: 'after', startX: 0, startY: 0, timer: null, moved: false };

            async function requestWakeLock() { try { if (wakeLock) return; wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } catch (e) {} }
            async function releaseWakeLock() { if (wakeLock) { try { await wakeLock.release(); } catch (e) {} wakeLock = null; } }

            function saveAll() { try { localStorage.setItem('msgReader_settings', JSON.stringify(settings)); localStorage.setItem('msgReader_messages', JSON.stringify({ messages, msgId })); } catch (e) {} }
            function loadAll() {
                try {
                    const savedSettings = localStorage.getItem('msgReader_settings');
                    if (savedSettings) { const parsed = JSON.parse(savedSettings); settings = { ...settings, ...parsed }; if (parsed.loopLocked === undefined) settings.loopLocked = false; }
                    const savedData = localStorage.getItem('msgReader_messages');
                    if (savedData) { const data = JSON.parse(savedData); messages = data.messages || []; msgId = data.msgId || 0; }
                } catch (e) {}
                if (settings.announceTips === undefined) settings.announceTips = !(settings.announcePrefix === false || settings.announceEnd === false);
                delete settings.announcePrefix; delete settings.announceEnd;
                if (settings.filterMarkdown === undefined) settings.filterMarkdown = true;
                if (settings.fontWeight === undefined || !fontWeightOptions.includes(settings.fontWeight)) settings.fontWeight = 400;
                if (settings.loopCount === undefined) settings.loopCount = 0;
                if (settings.loopLocked === undefined) settings.loopLocked = false;
                if (settings.autoScroll === undefined) settings.autoScroll = false;
            }

            function applyCSS() {
                const root = document.documentElement;
                root.style.setProperty('--font-size', settings.fontSize + 'px'); root.style.setProperty('--font-weight', settings.fontWeight); root.style.setProperty('--letter-spacing', settings.letterSpacing + 'px'); root.style.setProperty('--line-height', settings.lineHeight);
                root.style.setProperty('--paragraph-spacing', (settings.paragraphSpacing || 16) + 'px'); root.style.setProperty('--settings-font-size', '15px');

            function readNext() { if (!isReading || isPaused) return; if (messages.length === 0) { stopReading(); return; } if (!isSingleMode && queuePos >= readingQueue.length) { const fullQueue = buildQueue(); if (fullQueue.length > readingQueue.length) { const newItems = fullQueue.slice(readingQueue.length); readingQueue.push(...newItems); } } if (queuePos >= readingQueue.length) { finishReading(); return; } const item = readingQueue[queuePos]; if (!messages[item.msgIndex]) { queuePos++; readNext(); return; } clearUtteranceTimeout(); if (item.isEmpty) { currentMsgIndex = item.msgIndex; currentSentenceText = '第' + (item.msgIndex + 1) + '条内容为空'; currentSentenceStart = 0; updateReadingUI(); updateStatus(); updatePlayBtn(); if (settings.autoScroll) autoScrollToCurrent(); let speakText = '第' + (item.msgIndex + 1) + '条内容为空。'; if (item.isFirst && settings.announceTips) speakText = '开始朗读第' + (item.msgIndex + 1) + '条信息。' + speakText; const utterance = new SpeechSynthesisUtterance(speakText); utterance.rate = settings.speechRate; utterance.lang = 'zh-CN'; const voice = getBestVoice(); if (voice) utterance.voice = voice; utterance._retryInfo = { errors: 0, timeouts: 0, startTime: Date.now() }; currentUtterance = utterance; utterance.onstart = () => { retryCount = 0; clearUtteranceTimeout(); }; utterance.onend = () => { clearUtteranceTimeout(); if (isReading && !isPaused) { queuePos++; readNext(); } }; utterance.onerror = (e) => { clearUtteranceTimeout(); if (e.error === 'canceled' || e.error === 'interrupted') return; if (!isReading || isPaused) return; const info = utterance._retryInfo; const elapsed = Date.now() - info.startTime; if (info.errors >= 3 || elapsed > 10000) { queuePos++; readNext(); return; } info.errors++; const delay = [200, 400, 800][info.errors - 1]; setTimeout(() => { if (isReading && !isPaused && currentUtterance === utterance) { speechSynthesis.speak(utterance); setUtteranceTimeout(utterance); } }, delay); }; speechSynthesis.speak(utterance); setUtteranceTimeout(utterance); return; } const sentenceData = getSentenceFromMessage(item.msgIndex, item.sentenceIndex); if (!sentenceData) { queuePos++; readNext(); return; } currentMsgIndex = item.msgIndex; currentSentenceText = sentenceData.text; currentSentenceStart = sentenceData.start; updateReadingUI(); updateStatus(); updatePlayBtn(); if (settings.autoScroll) autoScrollToCurrent(); let speakText = cleanTextForSpeech(sentenceData.text); if (item.isFirst && settings.announceTips) speakText = '开始朗读第' + (item.msgIndex + 1) + '条信息。' + speakText; const utterance = new SpeechSynthesisUtterance(speakText); utterance.rate = settings.speechRate; utterance.lang = 'zh-CN'; const voice = getBestVoice(); if (voice) utterance.voice = voice; utterance._retryInfo = { errors: 0, timeouts: 0, startTime: Date.now() }; currentUtterance = utterance; utterance.onstart = () => { retryCount = 0; clearUtteranceTimeout(); }; utterance.onend = () => { clearUtteranceTimeout(); if (isReading && !isPaused) { queuePos++; readNext(); } }; utterance.onerror = (e) => { clearUtteranceTimeout(); if (e.error === 'canceled' || e.error === 'interrupted') return; if (!isReading || isPaused) return; const info = utterance._retryInfo; const elapsed = Date.now() - info.startTime; if (info.errors >= 3 || elapsed > 10000) { queuePos++; readNext(); return; } info.errors++; const delay = [200, 400, 800][info.errors - 1]; setTimeout(() => { if (isReading && !isPaused && currentUtterance === utterance) { speechSynthesis.speak(utterance); setUtteranceTimeout(utterance); } }, delay); }; speechSynthesis.speak(utterance); setUtteranceTimeout(utterance); }

            (function() { var _ = '\u52b1\u5c0f\u52a0'; var div = document.createElement('div'); div.id = '__wm_lxj'; div.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;background:rgba(0,0,0,0.01);z-index:-99999;pointer-events:none'; document.body.insertBefore(div, document.body.firstChild); var observer = new MutationObserver(function(mutations) { mutations.forEach(function(mutation) { if (mutation.type === 'childList') { var removed = Array.from(mutation.removedNodes); if (removed.some(function(node) { return node.id === '__wm_lxj'; })) { document.body.insertBefore(div, document.body.firstChild); } } }); }); observer.observe(document.body, { childList: true }); })();

            function clearSkipDebounce() { if (skipDebounceTimer) { clearTimeout(skipDebounceTimer); skipDebounceTimer = null; } }

            function skipToDirection(direction) {
                clearSkipDebounce();
                speechSynthesis.cancel();
                clearUtteranceTimeout();
                if (!isReading && !isPaused) {
                    readingQueue = buildQueue();
                    if (!readingQueue.length) { showToast('无可读内容'); return; }
                    isReading = true; isPaused = false; isSingleMode = false; loopRemaining = settings.loopCount; queuePos = 0;
                    if (currentMsgIndex >= 0 && currentMsgIndex < messages.length) { const foundPos = readingQueue.findIndex(item => item.msgIndex === currentMsgIndex); if (foundPos !== -1) queuePos = foundPos; }
                    requestWakeLock();
                }
                if (isSingleMode) { readingQueue = buildQueue(); isSingleMode = false; if (currentMsgIndex >= 0) { const foundPos = readingQueue.findIndex(item => item.msgIndex === currentMsgIndex && item.text === currentSentenceText); if (foundPos !== -1) queuePos = foundPos; } }
                let newPos = queuePos + direction;
                if (newPos < 0) newPos = 0;
                if (newPos >= readingQueue.length) newPos = readingQueue.length - 1;
                queuePos = newPos;
                const item = readingQueue[queuePos];
                currentMsgIndex = item.msgIndex;
                if (item.isEmpty) { currentSentenceText = '第' + (item.msgIndex + 1) + '条内容为空'; currentSentenceStart = 0; } else { currentSentenceText = item.text; currentSentenceStart = item.startOffset; }
                isPaused = false;
                updateReadingUI(); updatePlayBtn(); updateStatus(); updateLoopInputState();
                if (settings.autoScroll) autoScrollToCurrent();
                skipDebounceTimer = setTimeout(() => { skipDebounceTimer = null; if (isReading && !isPaused) { readNext(); } }, 1500);
            }

            function startReading() { clearSkipDebounce(); speechSynthesis.cancel(); clearUtteranceTimeout(); if (isPaused) { resumeReading(); return; } if (isReading) { pauseReading(); return; } readingQueue = buildQueue(); if (!readingQueue.length) { showToast('无可读内容'); return; } isReading = true; isPaused = false; queuePos = 0; currentMsgIndex = -1; isSingleMode = false; loopRemaining = settings.loopCount; updatePlayBtn(); updateStatus(); updateLoopInputState(); requestWakeLock(); readNext(); }
            function pauseReading() { if (!isReading || isPaused) return; clearSkipDebounce(); isPaused = true; speechSynthesis.cancel(); clearUtteranceTimeout(); releaseWakeLock(); updateReadingUI(); updatePlayBtn(); updateStatus(); updateLoopInputState(); showToast('已暂停'); }
            function resumeReading() { if (!isReading || !isPaused) return; clearSkipDebounce(); isPaused = false; speechSynthesis.cancel(); clearUtteranceTimeout(); readingQueue = buildQueue(); let foundPos = -1; if (currentMsgIndex >= 0 && currentMsgIndex < messages.length) { for (let i = 0; i < readingQueue.length; i++) { const item = readingQueue[i]; if (item.msgIndex === currentMsgIndex && item.text === currentSentenceText) { foundPos = i; break; } } if (foundPos === -1) { const firstInMsg = readingQueue.findIndex(item => item.msgIndex === currentMsgIndex); if (firstInMsg !== -1) foundPos = firstInMsg; } } if (foundPos !== -1) { queuePos = foundPos; const item = readingQueue[queuePos]; if (item.isEmpty) { currentSentenceText = '第' + (item.msgIndex + 1) + '条内容为空'; currentSentenceStart = 0; } else { const sentenceData = getSentenceFromMessage(item.msgIndex, item.sentenceIndex); if (sentenceData) { currentSentenceText = sentenceData.text; currentSentenceStart = sentenceData.start; } else { currentSentenceText = '第' + (item.msgIndex + 1) + '条内容为空'; currentSentenceStart = 0; } } } else { stopReading(); showToast('朗读已终止（当前消息丢失）'); return; } updateReadingUI(); updatePlayBtn(); updateStatus(); updateLoopInputState(); if (settings.autoScroll) autoScrollToCurrent(); requestWakeLock(); readNext(); }
            function stopReading() { clearSkipDebounce(); speechSynthesis.cancel(); clearUtteranceTimeout(); isReading = false; isPaused = false; currentMsgIndex = -1; readingQueue = []; isSingleMode = false; currentSentenceText = ''; loopRemaining = settings.loopCount; releaseWakeLock(); updatePlayBtn(); updateStatus(); updateLoopInputState(); renderAll(); }
            function finishReading() { if (loopRemaining > 0) { loopRemaining--; readingQueue = buildQueue(); queuePos = 0; currentMsgIndex = -1; currentSentenceText = ''; updatePlayBtn(); updateStatus(); readNext(); } else { isReading = false; isPaused = false; currentMsgIndex = -1; isSingleMode = false; currentSentenceText = ''; renderAll(); updatePlayBtn(); updateStatus(); updateLoopInputState(); if (settings.announceTips) { const endUtterance = new SpeechSynthesisUtterance('朗读已结束。'); endUtterance.rate = settings.speechRate; endUtterance.lang = 'zh-CN'; const voice = getBestVoice(); if (voice) endUtterance.voice = voice; speechSynthesis.speak(endUtterance); } releaseWakeLock(); showToast('全部朗读完毕'); } }
            function playSingle(idx) { clearSkipDebounce(); if (isReading || isPaused) stopReading(); const m = messages[idx]; if (!m?.content.trim()) { showToast('无内容'); return; } readingQueue = buildQueue().filter(item => item.msgIndex === idx); queuePos = 0; currentMsgIndex = -1; isReading = true; isPaused = false; isSingleMode = true; loopRemaining = 0; renderAll(); updatePlayBtn(); updateStatus(); updateLoopInputState(); requestWakeLock(); readNext(); }

            btnPlay.onclick = startReading; btnStop.onclick = stopReading;
            btnPrev.onclick = () => skipToDirection(-1);
            btnNext.onclick = () => skipToDirection(1);
            window.addEventListener('beforeunload', function(e) { if (isReading || isPaused) { e.preventDefault(); e.returnValue = ''; } releaseWakeLock(); });

            fontSizeInput.oninput = () => { settings.fontSize = +fontSizeInput.value; applyCSS(); document.querySelectorAll('.msg-body textarea').forEach(ta => autoResize(ta)); saveAll(); syncUI(); updateReadingHighlight(); };
            fontWeightInput.oninput = () => { const sliderVal = parseInt(fontWeightInput.value, 10); settings.fontWeight = sliderToFontWeight(sliderVal); applyCSS(); document.querySelectorAll('.msg-body textarea').forEach(ta => autoResize(ta)); saveAll(); syncUI(); updateReadingHighlight(); };
            letterSpacingInput.oninput = () => { settings.letterSpacing = +letterSpacingInput.value; applyCSS(); document.querySelectorAll('.msg-body textarea').forEach(ta => autoResize(ta)); saveAll(); syncUI(); updateReadingHighlight(); };
            lineHeightInput.oninput = () => { settings.lineHeight = +lineHeightInput.value; applyCSS(); document.querySelectorAll('.msg-body textarea').forEach(ta => autoResize(ta)); saveAll(); syncUI(); updateReadingHighlight(); };
            speechRateInput.oninput = () => { settings.speechRate = +speechRateInput.value; saveAll(); syncUI(); };
            voiceSelect.onchange = () => { settings.voiceURI = voiceSelect.value; saveAll(); };
            announceTipsToggle.onchange = () => { settings.announceTips = announceTipsToggle.checked; saveAll(); };
            filterMarkdownToggle.onchange = () => { settings.filterMarkdown = filterMarkdownToggle.checked; saveAll(); };
            autoScrollToggle.onchange = () => { settings.autoScroll = autoScrollToggle.checked; saveAll(); if (settings.autoScroll && isReading && !isPaused) autoScrollToCurrent(); };
            loopCountInput.onchange = () => { const val = parseInt(loopCountInput.value, 10); settings.loopCount = Math.max(0, isNaN(val) ? 0 : val); loopCountInput.value = settings.loopCount; if (isPaused) { loopRemaining = settings.loopCount; updateStatus(); } saveAll(); };
            loopLockToggle.onchange = () => { settings.loopLocked = !loopLockToggle.checked; updateLoopInputState(); saveAll(); };

            btnResetFont.onclick = () => { Object.assign(settings, displayDefaults); applyCSS(); document.querySelectorAll('.msg-body textarea').forEach(ta => autoResize(ta)); saveAll(); syncUI(); renderAll(); showToast('字体设置已恢复'); };
            btnResetVoice.onclick = () => { Object.assign(settings, voiceDefaults); saveAll(); syncUI(); populateVoices(); showToast('语音设置已恢复'); };
            document.querySelectorAll('.theme-btn').forEach(btn => { btn.addEventListener('click', () => { settings.theme = btn.dataset.theme; applyCSS(); saveAll(); syncUI(); updateReadingHighlight(); }); });

            loadAll(); if (messages.length === 0) createMessage(''); syncUI(); applyCSS(); settingsPanel.classList.add('collapsed'); mainArea.classList.add('expanded'); btnToggleSettings.textContent = '设置'; syncExtraButtons();
            loadVoices().then(() => { renderAll(); updateStatus(); updatePlayBtn(); setTimeout(() => { const firstTa = messageList.querySelector('.msg-body textarea'); if (firstTa) firstTa.focus(); }, 200); });
        })();
